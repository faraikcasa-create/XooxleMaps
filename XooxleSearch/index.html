<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>XooxleSearch</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:white;min-height:100vh;display:flex;flex-direction:column}.header{padding:15px 20px;display:flex;justify-content:space-between;font-size:14px}.header a{color:#555;text-decoration:none;margin-left:15px}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;margin-top:-50px}.logo{font-size:70px;font-weight:bold;margin-bottom:30px}.logo span:nth-child(1){color:#4285f4}.logo span:nth-child(2){color:#ea4335}.logo span:nth-child(3){color:#fbbc05}.logo span:nth-child(4){color:#4285f4}.logo span:nth-child(5){color:#34a853}.logo span:nth-child(6){color:#ea4335}.search-box{width:100%;max-width:600px;position:relative}.search-box input{width:100%;padding:16px 50px 16px 20px;border:1px solid #dfe1e5;border-radius:24px;font-size:16px;outline:none;box-shadow:0 1px 6px rgba(0,0,0,0.1)}.buttons{margin-top:25px;display:flex;gap:12px}.btn{padding:10px 18px;background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;cursor:pointer}.results{width:100%;max-width:700px;margin:30px auto 0;display:none;text-align:right}.result{padding:18px 0;border-bottom:1px solid #eee}.result a{color:#1a0dab;text-decoration:none;font-size:18px}.result .url{color:#006621;font-size:13px}.result .desc{color:#545454;font-size:14px;margin-top:4px}.footer{background:#f2f2f2;padding:15px 20px;margin-top:auto;color:#70757a;font-size:14px;display:flex;justify-content:space-between}</style></head><body><div class="header"><div><a href="../XooxleGithub/">مشاريعي</a><a href="../XooxleMaps/">الخرائط</a></div><div><a href="#">XooxleMail</a></div></div><div class="center"><div class="logo"><span>X</span><span>o</span><span>o</span><span>x</span><span>l</span><span>e</span></div><div class="search-box"><input id="q" placeholder="قلب في Xooxle..." onkeypress="if(event.key==='Enter')search()"></div><div class="buttons"><button class="btn" onclick="search()">بحث Xooxle</button><button class="btn" onclick="lucky()">ضربة حظ</button></div><div class="results" id="results"></div></div><div class="footer"><span>المغرب</span><span>© 2026 Xooxle</span></div><script>const data=[{title:"XooxleMaps - خرائط Xooxle",url:"https://faraikcasa-create.github.io/XooxleMaps/",desc:"أفضل خرائط للمغرب والعالم."},{title:"XooxleTube - شاهد الفيديوات",url:"https://faraikcasa-create.github.io/XooxleMaps/XooxleTube/",desc:"منصة الفيديو الأولى في المغرب."},{title:"XooxleEarth",url:"https://faraikcasa-create.github.io/XooxleMaps/XooxleEarth/",desc:"استكشف العالم في 3D."},{title:"مكناس - ويكيبيديا",url:"https://ar.wikipedia.org/wiki/مكناس",desc:"مكناس مدينة في شمال المغرب."}];function search(){let q=document.getElementById('q').value.toLowerCase().trim();if(!q){alert('كتب شي حاجة!');return}let res=data.filter(d=>d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q));if(res.length==0)res=data;let html=`<div style="color:#70757a;font-size:14px;margin-bottom:15px">حوالي ${res.length} نتيجة (0.32 ثانية)</div>`;res.forEach(r=>{html+=`<div class="result"><div class="url">${r.url}</div><a href="${r.url}">${r.title}</a><div class="desc">${r.desc}</div></div>`});document.getElementById('results').innerHTML=html;document.getElementById('results').style.display='block';}function lucky(){let r=data[Math.floor(Math.random()*data.length)];window.location.href=r.url;}</script></body></html>
