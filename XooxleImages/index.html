<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Xooxle Images</title>
<style>
body{text-align:center;font-family:Arial;padding-top:50px}
.logo{font-size:55px;font-weight:bold}
.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#EA4335}
.logo span:nth-child(3){color:#FBBC05}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#34A853}
.logo span:nth-child(6){color:#EA4335}
.sub{color:#4285F4;font-size:22px}
#q{width:90%;max-width:650px;height:50px;border-radius:25px;border:1px solid #ddd;padding:0 25px}
.btn{margin-top:20px;padding:12px 25px;background:#f8f9fa;border:1px solid #eee;border-radius:5px}
</style>
</head>
<body>
<div class="logo"><span>X</span><span>o</span><span>o</span><span>x</span><span>l</span><span>e</span><span class="sub">Images</span></div>
<br>
<input id="q" placeholder="Search on XooxleImages.com">
<br><br>
<button class="btn" onclick="location='https://www.google.com/search?tbm=isch&q='+document.getElementById('q').value">Search Images</button>
</body>
</html>
