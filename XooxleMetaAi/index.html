<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xooxle</title><style>body{font-family:sans-serif;text-align:center;background:#f8fafc}.t{background:#1e40af;color:#fff;padding:8px}.b{background:#fff;border-radius:24px;padding:12px;display:flex;gap:8px;max-width:700px;margin:15px auto;border:3px solid #bfdbfe;align-items:center}input{flex:1;border:none;font-size:20px;outline:none}.m{background:#fef3c7;border:3px solid #fcd34d;width:62px;height:62px;border-radius:50%;font-size:28px}.m.on{background:#fecaca}.btn{background:#059669;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-weight:800}#st{display:none;background:#fffbeb;padding:12px;border-radius:12px;max-width:700px;margin:10px auto;border:2px solid #fcd34d}.r{max-width:900px;margin:20px auto;padding:20px}.c{background:#fff;border-radius:20px;padding:24px;border:2px solid #86efac;text-align:right}</style></head><body><div class="t">🧠 للجميع 💚</div><h1>ابحث بالصوت يا بطل 🎤</h1><p>قل: قصة - صلاة - اهدأ</p><div class="b"><button id="mic" class="m" onclick="voice()">🎤</button><input id="q" placeholder="قل: قصة..."><button class="btn" onclick="go()">ابحث</button></div><div id="st">🎤 كنسمعك...</div><div id="rb" class="r"><div id="rr" class="c"></div></div><script>let rec,on=false;function voice(){let b=document.getElementById('mic'),i=document.getElementById('q'),s=document.getElementById('st');let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Chrome');return;}if(!rec){rec=new SR();rec.lang='ar-MA';rec.onstart=()=>{on=true;b.classList.add('on');b.textContent='🔴';s.style.display='block';s.textContent='🎤 كنسمعك...';};rec.onresult=(e)=>{i.value=e.results[0][0].transcript;s.textContent='✅ '+i.value;setTimeout(go,600);};rec.onend=()=>{on=false;b.classList.remove('on');b.textContent='🎤';};}if(on)rec.stop();else rec.start();}function go(){let q=document.getElementById('q').value.trim();if(!q)return;let r=document.getElementById('rr'),rb=document.getElementById('rb');rb.style.display='block';let h=q.includes('صلاة')?'<h3>🕌 كيف تصلي</h3>الله أكبر - الفاتحة - اركع سبحان ربي العظيم - اسجد سبحان ربي الأعلى - أحسنت!':q.includes('قصة')?'<h3>📖 قصة يوسف</h3>كان بطل يحب الله - الله أنقذه - أنت بطل مثله!':q.includes('اهدأ')?'<h3>🍃 اهدأ</h3>شهيق 4 - حبس 2 - زفير 4 - قل لا حول ولا قوة إلا بالله': '<h3>🌟 '+q+'</h3>أنت مميز وبطل! 💚';r.innerHTML=h;}</script></body></html>
