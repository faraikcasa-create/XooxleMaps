<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XooxleMaps - Oujda</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{height:100vh;display:flex;flex-direction:column}
header{background:#1a73e8;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:800}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:11px 45px 11px 16px;border-radius:24px;border:none;outline:none;font-size:15px}
.search-box button{position:absolute;right:4px;top:4px;bottom:4px;width:36px;border-radius:50%;border:none;background:#1a73e8;color:#fff;cursor:pointer}
#map{flex:1}
.controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:8px;background:#fff;padding:8px 12px;border-radius:28px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.controls button{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px;font-weight:600}
.controls button.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
</style>
</head>
<body>
<header>
<h1>XooxleMaps</h1>
<div class="search-box">
<input id="q" placeholder="Chercher a Oujda... gare, fac..." onkeydown="if(event.key==='Enter')search()">
<button onclick="search()">🔍</button>
</div>
</header>
<div id="map"></div>
<div class="controls">
<button class="active" onclick="setStyle('streets',this)">Plan</button>
<button onclick="setStyle('sat',this)">Satellite</button>
<button onclick="locate()">📍 Moi</button>
</div>
<script>
const map=L.map('map').setView([34.6814,-1.9086],13);
let base=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
L.marker([34.6814,-1.9086]).addTo(map).bindPopup('<b>Oujda</b><br>XooxleMaps').openPopup();
function setStyle(t,btn){
document.querySelectorAll('.controls button').forEach(b=>{if(b.textContent!='📍 Moi')b.classList.remove('active')});
if(btn)btn.classList.add('active');
map.removeLayer(base);
if(t==='sat')base=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);
else base=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
}
async function search(){
const q=document.getElementById('q').value;if(!q)return;
const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+' Oujda')}&limit=5`);
const d=await r.json();
if(d[0]){map.setView([d[0].lat,d[0].lon],16);L.marker([d[0].lat,d[0].lon]).addTo(map).bindPopup(d[0].display_name).openPopup();}
}
function locate(){map.locate({setView:true,maxZoom:16});map.on('locationfound',e=>{L.marker(e.latlng).addTo(map).bindPopup('Vous etes ici').openPopup();});}
</script>
</body>
</html>
