<!DOCTYPE html>     
<html><head><meta  name="viewport" content="width=device-width"><title>XooxleGmail</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f6f8fc;display:flex;height:100vh}.sidebar{width:260px;background:#f6f8fc;padding:15px}.logo{font-size:22px;font-weight:bold;margin-bottom:20px}.compose{background:#c2e7ff;padding:14px 24px;border-radius:16px;border:none;font-weight:bold;margin-bottom:20px;cursor:pointer}.menu-item{padding:8px 12px;border-radius:20px;display:flex;justify-content:space-between;cursor:pointer}.menu-item.active{background:#d3e3fd;font-weight:bold}.main{flex:1;background:white;border-radius:16px;margin:8px 8px 8px 0;display:flex;flex-direction:column;overflow:hidden}.topbar{padding:12px 20px;border-bottom:1px solid #eee;display:flex;gap:15px}.topbar input{flex:1;max-width:500px;padding:10px 15px;background:#eaf1fb;border:none;border-radius:20px}.emails{flex:1;overflow:auto}.email-row{display:flex;align-items:center;padding:12px 20px;border-bottom:1px solid #f1f1f1;cursor:pointer}.email-row.unread{font-weight:bold}.from{width:120px}.subject{flex:1;white-space:nowrap;overflow:hidden}.time{width:70px;font-size:12px;color:#666}.view{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}.view-box{background:white;border-radius:16px;padding:25px;max-width:700px;width:100%}.compose-box{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:500px;max-width:95%;background:white;border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.2);display:none;flex-direction:column;z-index:20}.c-head{background:#f2f6fc;padding:12px 15px;display:flex;justify-content:space-between}.c-body{padding:15px;display:flex;flex-direction:column;gap:10px}.c-body input,.c-body textarea{padding:10px;border:1px solid #ddd;border-radius:8px}.c-foot{padding:10px 15px;display:flex;gap:10px}.send{background:#0b57d0;color:white;padding:8px 20px;border:none;border-radius:20px}</style></head><body><div class="sidebar"><div class="logo">✉️ XooxleGmail</div><button class="compose" onclick="openC()">✏️ إنشاء</button><div class="menu-item active"><span>📥 الوارد</span><span>4</span></div><div class="menu-item"><span>⭐ مميزة</span></div><div class="menu-item"><span>📤 المرسلة</span></div><div class="menu-item"><span>🗑️ المهملات</span></div></div><div class="main"><div class="topbar"><span>☰</span><input placeholder="البحث في البريد"><span>⚙️</span></div><div class="emails" id="emails"></div></div><div class="view" id="view" onclick="closeV()"><div class="view-box" onclick="event.stopPropagation()"><h3 id="vSub"></h3><p style="color:#666;margin:10px 0" id="vFrom"></p><div id="vBody"></div><br><button onclick="closeV()">إغلاق</button></div></div><div class="compose-box" id="cBox"><div class="c-head"><span>رسالة جديدة</span><span onclick="closeC()" style="cursor:pointer">✕</span></div><div class="c-body"><input id="cTo" placeholder="إلى"><input id="cSub" placeholder="الموضوع"><textarea id="cBody" rows="6" placeholder="اكتب رسالتك..."></textarea></div><div class="c-foot"><button class="send" onclick="sendM()">إرسال</button></div></div><script>const mails=[{from:"فريق Xooxle",sub:"مرحبا بك في XooxleGmail! 🎉",body:"مبروك! XooxleGmail ديالك خدام!",time:"07:35",unread:true},{from:"Google",sub:"مشروعك XooxleMaps واعر!",body:"استمر!",time:"أمس",unread:true},{from:"XooxleTube",sub:"فيديو جديد",body:"الفيديو ناجح!",time:"أمس",unread:false},{from:"أحمد",sub:"فين وصلتي؟",body:"سمعت عندك XooxleGmail!",time:"02/12",unread:false}];function render(){document.getElementById('emails').innerHTML=mails.map((m,i)=>`<div class="email-row ${m.unread?'unread':''}" onclick="openV(${i})"><span>☐ ☆</span><span class="from" style="margin-right:10px">${m.from}</span><span class="subject">${m.sub}</span><span class="time">${m.time}</span></div>`).join('');}function openV(i){let m=mails[i];vSub.innerText=m.sub;vFrom.innerText=m.from+' - '+m.time;vBody.innerHTML=m.
