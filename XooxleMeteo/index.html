<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XooxleMeteo</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#4285F4;--red:#EA4335;--yellow:#FBBC05;--green:#34A853}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Google Sans',sans-serif;background:#f8f9fa;min-height:100vh;color:#202124}
header{background:white;box-shadow:0 1px 6px rgba(0,0,0,.1);padding:12px 20px;display:flex;justify-content:space-between;position:sticky;top:0}
.logo{font-size:24px;font-weight:700}
.logo span:nth-child(1){color:var(--blue)}.logo span:nth-child(2){color:var(--red)}
.logo span:nth-child(3){color:var(--yellow)}.logo span:nth-child(4){color:var(--blue)}
.logo span:nth-child(5){color:var(--green)}.logo span:nth-child(6){color:var(--red)}
.logo i{color:#5f6368;font-weight:400;margin-left:6px;font-style:normal}
.searchBox{display:flex;gap:8px;max-width:500px;margin:20px auto;padding:0 15px}
.searchBox input{flex:1;padding:14px 20px;border-radius:24px;border:1px solid #dadce0;font-size:16px;outline:none}
.searchBox button{background:var(--blue);color:white;border:none;padding:0 22px;border-radius:24px;font-weight:600}
.wrap{max-width:900px;margin:0 auto;padding:15px}
.card{background:white;border-radius:20px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:16px}
.current{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.temp{font-size:64px;font-weight:700}
.city{font-size:28px;font-weight:600}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.meta div{background:#f1f3f4;border-radius:12px;padding:12px;text-align:center}
.days{display:flex;gap:10px;overflow:auto}
.day{min-width:110px;background:white;border-radius:16px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.hourly{display:flex;gap:12px;overflow:auto}
.hour{min-width:80px;text-align:center}
.badge{background:#e8f0fe;color:#4285F4;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600}
</style>
</head>
<body>
<header><div class="logo"><span>X</span><span>o</span><span>o</span><span>x</span><span>l</span><span>e</span><i>Meteo</i></div><div style="font-size:13px;color:#5f6368">faraikcasa</div></header>
<div class="searchBox"><input id="q" placeholder="Ville... Meknes, Casa, Paris"><button onclick="searchCity()">Go</button></div>
<div class="wrap">
<div class="card current"><div><div class="badge" id="dateNow">...</div><div class="city" id="city">Meknès</div><div id="desc" style="color:#5f6368">Chargement</div><div class="temp" id="temp">--°</div><div id="feels"></div></div><div style="text-align:center"><div id="icon" style="font-size:90px">☀️</div><div class="meta"><div><span>💧</span><b id="hum">--%</b></div><div><span>💨</span><b id="wind">--</b></div><div><span>🌅</span><b id="sun">--</b></div></div></div></div>
<div style="font-weight:600;margin:18px 0 10px">7 jours</div><div class="days" id="days"></div>
<div style="font-weight:600;margin:18px 0 10px">24h</div><div class="card"><div class="hourly" id="hourly"></div></div>
<div class="card" style="text-align:center;background:linear-gradient(135deg,#4285F4,#34A853);color:white"><b>XooxleMeteo • XooxleMaps Family</b><br><br><button onclick="locate()" style="background:white;color:#4285F4;border:none;padding:10px 18px;border-radius:20px;font-weight:700">📍 Ma Position</button></div>
</div>
<script>
const WMO={0:['Ciel dégagé','☀️'],1:['Principalement dégagé','🌤️'],2:['Partiellement nuageux','⛅'],3:['Couvert','☁️'],45:['Brouillard','🌫️'],51:['Bruine','🌦️'],61:['Pluie légère','🌧️'],63:['Pluie','🌧️'],65:['Forte pluie','⛈️'],71:['Neige','❄️'],80:['Averses','🌦️'],95:['Orage','⛈️']};
function getWMO(c){return WMO[c]||['Nuageux','☁️']}
let lat=33.8935, lon=-5.5473, cityName='Meknès, MA';
async function loadWeather(){
 document.getElementById('city').textContent=cityName;
 const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=7`;
 const r=await fetch(url); const d=await r.json(); const cur=d.current;
 const info=getWMO(cur.weather_code);
 document.getElementById('temp').textContent=Math.round(cur.temperature_2m)+'°';
 document.getElementById('feels').textContent='Ressenti '+Math.round(cur.apparent_temperature)+'°';
 document.getElementById('desc').textContent=info[0];
 document.getElementById('icon').textContent=info[1];
 document.getElementById('hum').textContent=cur.relative_humidity_2m+'%';
 document.getElementById('wind').textContent=Math.round(cur.wind_speed_10m)+' km/h';
 document.getElementById('dateNow').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
 if(d.daily.sunrise) document.getElementById('sun').textContent=d.daily.sunrise[0].split('T')[1];
 let h=''; for(let i=0;i<7;i++){const code=d.daily.weather_code[i];const inf=getWMO(code);const date=new Date(d.daily.time[i]);h+=`<div class="day"><div style="color:#5f6368;font-size:12px">${date.toLocaleDateString('fr-FR',{weekday:'short'})}</div><div style="font-size:32px">${inf[1]}</div><b>${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°</b><div style="font-size:12px">${inf[0]}</div></div>`} document.getElementById('days').innerHTML=h;
 let hh=''; for(let i=0;i<24;i++){const t=new Date(d.hourly.time[i]);const inf=getWMO(d.hourly.weather_code[i]);hh+=`<div class="hour"><div style="font-size:12px;color:#5f6368">${t.getHours()}h</div><div style="font-size:24px">${inf[1]}</div><b>${Math.round(d.hourly.temperature_2m[i])}°</b></div>`} document.getElementById('hourly').innerHTML=hh;
}
async function searchCity(){
 const q=document.getElementById('q').value.trim(); if(!q) return;
 const res=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=fr&format=json`);
 const data=await res.json(); if(!data.results?.length){alert('Ville non trouvée');return;}
 const p=data.results[0]; lat=p.latitude; lon=p.longitude; cityName=p.name+', '+(p.country_code||''); loadWeather();
}
function locate(){navigator.geolocation.getCurrentPosition(pos=>{lat=pos.coords.latitude; lon=pos.coords.longitude; cityName='Ma Position'; loadWeather();})}
loadWeather();
</script>
</body>
</html>
