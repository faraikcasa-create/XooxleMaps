<!DOCTYPE html>
<html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>XooxleTube</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0f0f0f;color:white}.header{background:#0f0f0f;padding:12px 20px;display:flex;align-items:center;gap:15px;position:sticky;top:0;z-index:10;border-bottom:1px solid #303030}.logo{font-weight:bold;font-size:20px}.logo span{background:red;padding:2px 6px;border-radius:6px}.search{flex:1;max-width:600px;display:flex}.search input{flex:1;padding:10px 15px;border-radius:20px 0 0 20px;border:1px solid #303030;background:#121212;color:white;outline:none}.search button{padding:10px 20px;border-radius:0 20px 20px 0;border:1px solid #303030;background:#303030;color:white;cursor:pointer}.main{display:flex}.sidebar{width:200px;padding:15px}.side-item{padding:10px;border-radius:8px;margin-bottom:5px}.side-item.active{background:#272727}.videos{flex:1;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.video-card{cursor:pointer}.thumb{width:100%;height:170px;background:#272727;border-radius:12px;position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.time{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.8);padding:2px 6px;border-radius:4px;font-size:12px}.info{display:flex;gap:10px;margin-top:10px}.avatar{width:36px;height:36px;background:#555;border-radius:50%}.title{font-size:14px;font-weight:bold}.channel{font-size:13px;color:#aaa}.player{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.player-box{width:100%;max-width:900px;background:#000;border-radius:12px;overflow:hidden}.player-box iframe{width:100%;height:400px;border:none}.close{padding:12px;background:#272727;text-align:center;cursor:pointer}</style></head><body><div class="header"><div class="logo"><span>▶</span> XooxleTube</div><div class="search"><input id="s" placeholder="قلب على فيديو..."><button onclick="searchV()">🔍</button></div></div><div class="main"><div class="sidebar"><div class="side-item active">🏠 الرئيسية</div><div class="side-item">🔥 الرائج</div><div class="side-item">🎵 موسيقى</div><div class="side-item">⚽ رياضة</div></div><div class="videos" id="videos"></div></div><div class="player" id="player" onclick="closeP()"><div class="player-box" onclick="event.stopPropagation()"><div id="pc"></div><div class="close" onclick="closeP()">✕ إغلاق</div></div></div><script>const vids=[{id:"jNQXAC9IVRw",t:"أول فيديو في تاريخ يوتيوب",c:"jawed",img:"https://img.youtube.com/vi/jNQXAC9IVRw/mqdefault.jpg",d:"0:19"},{id:"dQw4w9WgXcQ",t:"تعلم البرمجة من الصفر",c:"Xooxle Academy",img:"https://img.youtube.com/vi/dQw4w9WgXcQ/mqdefault.jpg",d:"3:33"},{id:"kJQP7kiw5Fk",t:"Despacito",c:"Luis Fonsi",img:"https://img.youtube.com/vi/kJQP7kiw5Fk/mqdefault.jpg",d:"4:42"},{id:"RgKAFK5djSk",t:"شفشاون - المغرب",c:"Visit Morocco",img:"https://img.youtube.com/vi/RgKAFK5djSk/mqdefault.jpg",d:"8:12"}];function render(list){document.getElementById('videos').innerHTML=list.map(v=>`<div class="video-card" onclick="play('${v.id}')"><div class="thumb"><img src="${v.img}"><div class="time">${v.d}</div></div><div class="info"><div class="avatar"></div><div><div class="title">${v.t}</div><div class="channel">${v.c}</div></div></div></div>`).join('');}function play(id){document.getElementById('pc').innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen></iframe>`;document.getElementById('player').style.display='flex';}function closeP(){document.getElementById('player').style.display='none';document.getElementById('pc').innerHTML='';}function searchV(){let q=document.getElementById('s').value.toLowerCase();if(!q)return render(vids);render(vids.filter(v=>v.t.toLowerCase().includes(q)));}render(vids);</script></body></html>
